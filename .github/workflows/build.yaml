name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. r52)'
        required: true

permissions:
  contents: write

jobs:
  # make zip file containing scripts, assets, and composer deps
  build:
    runs-on: ubuntu-latest

    env:
      ZIP_NAME: "megalopolis-${{ github.event.inputs.version }}.zip"
      ARTIFACT_NAME: "megalopolis-${{ github.event.inputs.version }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # the version must match App::VERSION, or the update check will keep notifying
      - name: Check version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          expected="r$(sed -n 's/^\s*const int VERSION = \([0-9]\+\);/\1/p' req/Core/App.php)"
          if [ "$VERSION" != "$expected" ]; then
            echo "::error::Version $VERSION does not match App::VERSION ($expected)"
            exit 1
          fi
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::error::Release $VERSION already exists"
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader
      
      - name: Create release zip
        run: |
          zip -r "$ZIP_NAME" \
            req \
            script \
            store \
            style \
            vendor \
            .htaccess \
            changelog.txt \
            composer.json \
            composer.lock \
            config.php \
            index.php \
            README.md \
            THIRD_PARTY_LICENSES.txt
          echo "Created $ZIP_NAME"

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_NAME }}
          archive: false # because we already have a zip file, we don't want to zip it again

      # create a draft release with the zip; publish it manually after review
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          gh release create "$VERSION" "$ZIP_NAME" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Megalopolis $VERSION" \
            --generate-notes
