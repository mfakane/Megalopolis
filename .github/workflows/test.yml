name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Compare all 10,000 work JSON responses per backend
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo_sqlite, pdo_mysql
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer analyse
      - run: composer test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/Browser/package-lock.json
      - run: npm ci --prefix tests/Browser
      - run: npx --prefix tests/Browser playwright install --with-deps chromium
      - run: composer test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-e2e
          path: test-results/
  r46-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Restore r46 databases and test current checkout
        env:
          FULL: ${{ inputs.full }}
        run: bash compat/test.sh "$([ "$FULL" = true ] && echo full || echo quick)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: r46-compatibility
          path: test-results/
  r46-upgrade-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mysql: ['5.7.17', '5.6.35']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test old keys, writes, search and backup restoration
        env:
          MYSQL_VERSION: ${{ matrix.mysql }}
        run: bash compat/upgrade.sh "$MYSQL_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: r46-upgrade-mysql-${{ matrix.mysql }}
          path: test-results/
